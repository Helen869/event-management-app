name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, tests, coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Unit tests
        run: pytest tests/unit --junitxml=reports/unit.xml --cov --cov-report=

      # Runs even if unit tests failed so both suites are reported independently.
      - name: API integration tests
        if: ${{ !cancelled() }}
        run: pytest tests/integration --junitxml=reports/integration.xml --cov --cov-append --cov-report=

      - name: Coverage report (fails below 80%)
        if: ${{ !cancelled() }}
        run: |
          coverage xml -o reports/coverage.xml
          coverage html -d reports/htmlcov
          coverage report --fail-under=80

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-reports
          path: backend/reports/

  frontend:
    name: Frontend (type check, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build
