[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
# Protocol bodies are type declarations, never executed.
exclude_also = ['class \w+\(Protocol\):']
